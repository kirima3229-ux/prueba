{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="migas"><a href="{% url 'cuentas:usuarios' %}">Usuarios</a></div>
<div class="encabezado"><h1>{{ titulo }}</h1></div>
<form method="post" class="tarjeta" novalidate>
  {% csrf_token %}
  {% include "_form.html" %}
  {% if not usuario_obj %}<p class="texto-suave">La contraseña es temporal: el usuario deberá cambiarla al entrar.</p>{% endif %}
  <div class="acciones">
    <button class="boton" type="submit">Guardar</button>
    <a class="boton secundario" href="{% url 'cuentas:usuarios' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
