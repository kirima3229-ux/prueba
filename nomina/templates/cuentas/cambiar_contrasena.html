{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<div class="encabezado"><h1>Cambiar contraseña</h1></div>
<div class="tarjeta">
<form method="post" novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}<div class="mensaje error">{{ form.non_field_errors }}</div>{% endif %}
  {% for campo in form %}{% include "_campo.html" %}{% endfor %}
  <button class="boton" type="submit">Guardar</button>
</form>
</div>
{% endblock %}
