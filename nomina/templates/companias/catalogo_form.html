{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="migas"><a href="{% url 'companias:lista' %}">Compañías</a> › <a href="{% url 'companias:detalle' compania.pk %}">{{ compania }}</a></div>
<div class="encabezado"><h1>{{ titulo }}</h1></div>
<form method="post" class="tarjeta" novalidate>
  {% csrf_token %}
  {% include "_form.html" %}
  <div class="acciones">
    <button class="boton" type="submit">Guardar</button>
    <a class="boton secundario" href="{% url 'companias:detalle' compania.pk %}">Cancelar</a>
  </div>
</form>
{% endblock %}
