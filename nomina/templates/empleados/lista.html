{% extends "base.html" %}
{% block titulo %}Empleados{% endblock %}
{% block contenido %}
<div class="encabezado">
  <h1>Empleados — {{ compania_activa }}</h1>
  {% if user.puede_editar %}
  <div class="acciones">
    <a class="boton" href="{% url 'empleados:nuevo' %}">Nuevo empleado</a>
    <a class="boton secundario" href="{% url 'empleados:importar' %}">Importar Excel/CSV</a>
  </div>
  {% endif %}
</div>
<form class="filtros" method="get" hx-get="{% url 'empleados:lista' %}" hx-target="#tabla-empleados" hx-trigger="input changed delay:300ms from:input[name=q], change from:select, submit" hx-push-url="true">
  <div class="campo"><label for="q">Buscar</label><input class="buscar" id="q" type="search" name="q" value="{{ q }}" placeholder="Nombre, número o últimos 4 del SSN"></div>
  <div class="campo"><label for="estado">Estado</label>
    <select id="estado" name="estado">
      <option value="activos" {% if estado == "activos" %}selected{% endif %}>Activos</option>
      <option value="inactivos" {% if estado == "inactivos" %}selected{% endif %}>Inactivos</option>
      <option value="todos" {% if estado == "todos" %}selected{% endif %}>Todos</option>
    </select></div>
  <noscript><button class="boton" type="submit">Filtrar</button></noscript>
</form>
<div id="tabla-empleados">{% include "empleados/_tabla.html" %}</div>
{% endblock %}
