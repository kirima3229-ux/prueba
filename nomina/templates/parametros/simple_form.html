{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="migas"><a href="{% url 'parametros:inicio' %}">Configuración</a></div>
<div class="encabezado"><h1>{{ titulo }}</h1></div>
<form method="post" class="tarjeta" novalidate>
  {% csrf_token %}
  {% include "_form.html" %}
  <div class="acciones"><button class="boton" type="submit">Guardar</button><a class="boton secundario" href="{% url 'parametros:inicio' %}">Cancelar</a></div>
</form>
{% if historial %}<div class="tarjeta"><h2>Historial de cambios</h2>{% include "_historial.html" %}</div>{% endif %}
{% endblock %}
